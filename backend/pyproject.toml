[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse backend — monitoring, incident and notification engines"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "pydantic-settings",
  "alembic",
  "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
